<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta
      name="description"
      content="个人闲置二手物品出售，实物实拍，价格与状态持续更新。"
    />
    <title>我的闲置小铺</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-content shell" id="top">
        <p class="eyebrow">SECOND-HAND GOODS</p>
        <h1>给闲置找个<br /><span>新家</span></h1>
        <p class="hero-copy">
          家中闲置陆续整理中，全部实物实拍。看中请联系我，先到先得。
        </p>
        <div class="hero-actions">
          <a class="button button-primary" href="#items">看看有什么</a>
          <button class="button button-ghost" id="contactButton" type="button">
            联系卖家
          </button>
        </div>
        <div class="hero-meta">
          <span id="areaText">取货地点待填写</span>
          <span aria-hidden="true">·</span>
          <span>状态实时更新</span>
        </div>
      </div>
      <div class="hero-stamp" aria-hidden="true">实物<br />实拍</div>
    </header>

    <main>
      <section class="catalog shell" id="items">
        <div class="section-heading">
          <div>
            <p class="eyebrow">AVAILABLE ITEMS</p>
            <h2>正在出售</h2>
          </div>
          <p class="item-count" id="itemCount"></p>
        </div>

        <div class="toolbar">
          <label class="search">
            <span class="sr-only">搜索物品</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" />
            </svg>
            <input id="searchInput" type="search" placeholder="搜索物品名称" />
          </label>
          <div class="filters" id="filters" aria-label="按状态筛选">
            <button class="filter active" data-filter="all" type="button">全部</button>
            <button class="filter" data-filter="available" type="button">在售</button>
            <button class="filter" data-filter="reserved" type="button">预订</button>
            <button class="filter" data-filter="sold" type="button">已售</button>
          </div>
        </div>

        <div class="product-grid" id="productGrid"></div>
        <div class="empty-state" id="emptyState" hidden>
          <strong>没有找到相关物品</strong>
          <span>换个关键词或筛选条件试试</span>
        </div>
      </section>

      <section class="contact-card shell">
        <div>
          <p class="eyebrow">PICKUP & CONTACT</p>
          <h2>看中哪件？<br />微信聊聊</h2>
        </div>
        <div class="contact-details">
          <p>
            页面状态会持续更新。默认自取，具体时间、地点和物品情况请微信沟通。
          </p>
          <button class="button button-primary" id="contactButtonBottom" type="button">
            复制微信号
          </button>
        </div>
      </section>
    </main>

    <footer class="footer shell">
      <span>闲置循环，让好东西继续被使用。</span>
    </footer>

    <dialog class="dialog product-dialog" id="productDialog">
      <button class="dialog-close" data-close-dialog type="button" aria-label="关闭">×</button>
      <div id="productDialogContent"></div>
    </dialog>

    <dialog class="dialog manage-dialog" id="manageDialog">
      <button class="dialog-close" data-close-dialog type="button" aria-label="关闭">×</button>
      <div class="manage-heading">
        <p class="eyebrow">LOCAL EDITOR</p>
        <h2>管理物品</h2>
        <p>修改会先保存在当前浏览器。完成后导出并替换网站中的 <code>items.js</code>。</p>
      </div>
      <form id="manageForm">
        <div class="site-settings">
          <label>
            <span>微信号</span>
            <input name="wechat" type="text" />
          </label>
          <label>
            <span>取货地点</span>
            <input name="area" type="text" />
          </label>
        </div>
        <div class="manage-list" id="manageList"></div>
        <div class="manage-actions">
          <button class="button button-primary" type="submit">保存本机预览</button>
          <button class="button button-outline" id="exportButton" type="button">
            导出 items.js
          </button>
          <button class="text-button" id="resetButton" type="button">恢复默认</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const assetVersion = Date.now();
      document.write(`<script src="./items.js?v=${assetVersion}"><\/script>`);
      document.write(`<script src="./app.js?v=${assetVersion}"><\/script>`);
    </script>
  </body>
</html>
